<body>

     <!-- The text element -->
    <a href="index.html">HOME</a><a style="color: white;" id="textToCopy">\\algfs.alghanim.com\Emp_Files\webdata\talentdata.xlsx</a> <a style="color: white;" id="textToCopy1">\\algfs.alghanim.com\Emp_Files\webdata\formalitiesdata.xlsx</a>
    <h2 style="text-align: center">Search by data & values..</h2>

<!-- The button to trigger the action -->
<button onclick="copyParagraphText()" class="btn">Get Talenhub data</button>
<button onclick="copyParagraphText1()" class="btn">Get Formalities data</button>

    <script>
        
    //copy file root    
        function copyParagraphText() {
  // Get the text content of the element
  var text = document.getElementById("textToCopy").innerText;

  // Use the Clipboard API to copy it
  navigator.clipboard.writeText(text).then(() => {
    // Optional: Success message
    alert("Text successfully copied!");
  }).catch(err => {
    console.error("Failed to copy text: ", err);
  });
} 

function copyParagraphText1() {
  // Get the text content of the element
  var text = document.getElementById("textToCopy1").innerText;

  // Use the Clipboard API to copy it
  navigator.clipboard.writeText(text).then(() => {
    // Optional: Success message
    alert("Text successfully copied!");
  }).catch(err => {
    console.error("Failed to copy text: ", err);
  });
} 
 //loading the data from excel sheet       
    
    let excelData = [];

// Read the Excel file when uploaded
document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    const reader = new FileReader();

    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });

        // Get the first worksheet
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];

        // Convert worksheet to JSON array of objects
        excelData = XLSX.utils.sheet_to_json(worksheet);
        alert("Excel file loaded successfully!");
    };

    reader.readAsArrayBuffer(file);
});

// Perform lookup on click
document.getElementById('searchBtn').addEventListener('click', function() {
    const searchValue = document.getElementById('searchInput').value.trim().toLowerCase();
    const container = document.getElementById('resultContainer');
    container.innerHTML = '';

    if (!excelData.length) {
        container.innerHTML = '<p>Please upload an Excel file first.</p>';
        return;
    }

    // Filter rows where any column value matches the search term
    const results = excelData.filter(row => {
        return Object.values(row).some(val => 
            String(val).toLowerCase().includes(searchValue)
        );
    });

    if (results.length === 0) {
        container.innerHTML = '<p>No matching data found.</p>';
        return;
    }

    // Build an HTML table for results
    let table = '<table border="1" cellpadding="5"><tr>';
    const headers = Object.keys(results[0]);
    headers.forEach(h => table += `<th>${h}</th>`);
    table += '</tr>';

    results.forEach(row => {
        table += '<tr>';
        headers.forEach(h => table += `<td>${row[h] || ''}</td>`);
        table += '</tr>';
    });
    table += '</table>';

    container.innerHTML = table;
});

    
    </script>

</html>
