<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <script src="https://kit.fontawesome.com/5f4c1bb038.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!DOCTYPE html>
    <html lang="en">
    
    <head>
      <meta charset="UTF-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Document</title>
    </head>
    
    <body>
      <div class="container">
        <header>ES register form</header>
        <div class="progress-bar">
          <div class="step">
            <p>
              Name
            </p>
            <div class="bullet">
              <span>1</span>
            </div>
            <div class="check fas fa-check"></div>
          </div>
          <div class="step">
            <p>
              Contact
            </p>
            <div class="bullet">
              <span>2</span>
            </div>
            <div class="check fas fa-check"></div>
          </div>
          <div class="step">
            <p>
              Business
            </p>
            <div class="bullet">
              <span>3</span>
            </div>
            <div class="check fas fa-check"></div>
          </div>
          <div class="step">
            <p>
              Submit
            </p>
            <div class="bullet">
              <span>4</span>
            </div>
            <div class="check fas fa-check"></div>
          </div>
        </div>
        <div class="form-outer">
          <form action="#">
            <div class="page slide-page">
              <div class="title">
                Basic Info:
              </div>
              <div class="field">
                <div class="label">
                  Name 
                </div>
                <input type="text">
              </div>
              <div class="field">
                <div class="label">
                  Position
                </div>
                <input type="text">
              </div>
              <div class="field">
                <button class="firstNext next">Next</button>
              </div>
            </div>
            <div class="page">
              <div class="title">
                Contact Info:
              </div>
              <div class="field">
                <div class="label">
                  Email Address
                </div>
                <input type="email" placeholder="abc@alghanim.com">
              </div>
              <div class="field">
                <div class="label">
                  Phone Number - Ext.
                </div>
                <input type="Number" placeholder="1881111 - 2613">
              </div>
              <div class="field btns">
                <button class="prev-1 prev">Previous</button>
                <button class="next-1 next">Next</button>
              </div>
            </div>
            <div class="page">
              <div class="title">
                Business justification:
              </div>
              <div class="field">
                <div class="label">
                  Location:
                </div>
                <input type="text">
              </div>
              <div class="field">
                <div class="label">
                  Business Unite
                </div>
                <select>
				  <option> </option>
                  <option>Retail</option>
                  <option>Automotive</option>
                  <option>HR</option>
                  <option>Engineering</option>
				  <option>Others</option>
                </select>
              </div>
              <div class="field btns">
                <button class="prev-2 prev">Previous</button>
                <button class="next-2 next">Next</button>
              </div>
            </div>
            <div class="page">
              <div class="title">
                Login Details:
              </div>
              <div class="field">
                <div class="label">
                  Username
                </div>
                <input type="text">
              </div>
              <div class="field">
                <div class="label">
                  Password
                </div>
                <input type="password">
              </div>
              <div class="field btns">
                <button class="prev-3 prev">Previous</button>
                <button class="submit">Submit</button>
                </div>
            </div>
          </form>
        </div>
      </div>
    
    
    
    
    
    </body>
    
    </html>
</body>
<script src="script.js"></script>

</html>
