<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessing ES data</title>
    <!-- Include SheetJS library via CDN -->
    <link rel="icon" type="image/x-icon" href="files/ESlogo.jpg">     
    <title>Password Protected Gate</title>
    
    <style>
        
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }    
        
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e8e8e8;
        }
        
        
        .container {
            border: solid 1px #8d8d8d;
            padding: 50px;
            border-radius: 20px;
            background-color: #fff; 
        }    
        
        
        .btn{
            padding: 10px 20px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-radius: 10px;
            border: solid 1px #1034aa;
            border-bottom: solid 1px #90c2ff;
            background-color: cadetblue;
            font-weight: bolder;
        }

        .input{
            padding: 10px 40px;
            font-size: 1rem;
            letter-spacing: 3px;
            border-radius: 10px;
            border: solid 1px #1034aa;
            border-bottom: solid 1px #90c2ff;
            background-color: transparent;
            font-weight: bolder;
        }
       
        
        /* clock */
        
        .clock-container {
    background: rgba(30, 41, 59, 0.7);
    padding: 2rem 3rem;
    border-radius: 15px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    text-align: center;
}

.date-box {
    color: #94a3b8;
    font-size: 1.1rem;
    font-weight: 500;
    letter-spacing: 1.5px;
    margin-bottom: 0.5rem;
    text-transform: uppercase;
}

.clock-box {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 10px;
}

.time-display {
    color: #38bdf8; /* Vibrant cyan neon text */
    font-size: 4.5rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
}

.session-display {
    color: #f43f5e; /* Rose accent color for AM/PM */
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 1px;
}
        
        
        
    </style>
        
</head>
    
<body>

    <form id="loginForm">
    
        <a href="index.html">HOME</a>
    
         <div class="clock-container">
        <div class="date-box" id="date-display">Monday, Jan 01, 2026</div>
        <div class="clock-box">
            <div class="time-display" id="time-display">00:00:00</div>
            <div class="session-display" id="session-display">AM</div>
        </div>
    </div>

    <script src="scriptx.js"></script><br>
        
    <!-- A simple input field and a button -->
        <div class="container" >
        <h2 style="text-align: center;">Enter to access the ES Data Website</h2><br><br>
            <input class="input" type="password" id="passwordInput" placeholder="Enter password">
            <button class="btn" onclick="checkPassword()">Submit</button>
        </div>
</form>
    
    
    <script>
        
    document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault(); 
            
            var password = document.getElementById("passwordInput").value;
            
            if ( password == "EsAdMiN") {
            document.getElementById("loginForm").reset();
            load("lookup-data.html");
}
else {
            alert("The information you have entered was wrong!!");
            window.location.reload();
}
            function load(url)
    {
            location.href=url;
    }
    }); 
            
</script>

</body>
</html>
